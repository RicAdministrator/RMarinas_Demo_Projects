<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RMarinas Demo Projects" />
  <title>RMarinas Demo Projects</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="title-row">
    <div class="header">RMarinas Demo Projects</div>
    <div id="project-count" class="project-count">Showing 0 out of 0 projects</div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Project Name</th>
          <th>Tech Used</th>
          <th>Repo</th>
          <th>Demos</th>
        </tr>
        <tr class="filter-row">
          <td><input type="text" data-filter="projectName" placeholder="Filter project name" /></td>
          <td><input type="text" data-filter="techUsed" placeholder="Filter tech E.g. c#, c#/angular, c#/angular/sql" /></td>
          <td><input type="text" data-filter="repo" placeholder="Filter repo" /></td>
          <td><input type="text" data-filter="demos" placeholder="Filter demos" /></td>
        </tr>
      </thead>
      <tbody id="project-table-body"></tbody>
    </table>
  </div>
  <div class="footer">
    <a href="https://www.linkedin.com/in/ricardo-miguel-mari%C3%B1as-7217282b1/" target="_blank"
      rel="noopener noreferrer">LinkedIn</a> |
    <a href="https://ph.jobstreet.com/profiles/ricardomiguel-marias-Xlv3wyy2Mh" target="_blank"
      rel="noopener noreferrer">Jobstreet</a>
  </div>
  <script src="script.js"></script>
</body>

</html>
