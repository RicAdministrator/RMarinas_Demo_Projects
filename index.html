<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RMarinas Demo Projects" />
  <title>RMarinas Demo Projects</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="header">Header Text</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Project Name</th>
          <th>Tech Used</th>
          <th>Repo</th>
          <th>Demos</th>
        </tr>
        <tr class="filter-row">
          <td><input type="text" data-filter="projectName" placeholder="Filter project name" /></td>
          <td><input type="text" data-filter="techUsed" placeholder="Filter tech" /></td>
          <td><input type="text" data-filter="repo" placeholder="Filter repo" /></td>
          <td><input type="text" data-filter="demos" placeholder="Filter demos" /></td>
        </tr>
      </thead>
      <tbody id="project-table-body"></tbody>
    </table>
  </div>
  <div class="footer">Footer Text</div>
  <script src="script.js"></script>
</body>

</html>
